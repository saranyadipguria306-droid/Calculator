<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#f3f5f8">

<title>Calculator</title>

<style>

/* =========================
   THEME
========================= */

:root {
    --bg: #f3f5f8;
    --surface: rgba(255,255,255,.92);

    --text: #17181c;
    --muted: #858994;

    --key: #e7e9ee;
    --key-text: #17181c;

    --function: #d8dbe2;

    --accent: #17181c;
    --accent-text: #ffffff;

    --border: rgba(0,0,0,.08);

    --shadow:
        0 25px 70px rgba(0,0,0,.12);
}

@media (prefers-color-scheme: dark) {

    :root {
        --bg: #08090b;
        --surface: rgba(20,22,26,.96);

        --text: #f7f7f8;
        --muted: #858994;

        --key: #25282e;
        --key-text: #f5f5f6;

        --function: #35383f;

        --accent: #f5f5f6;
        --accent-text: #101114;

        --border: rgba(255,255,255,.08);

        --shadow:
            0 25px 70px rgba(0,0,0,.55);
    }
}


/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;

    width: 100%;
    min-height: 100%;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;

    justify-content: center;
    align-items: center;

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* =========================
   APP
========================= */

.app {

    width: 100%;

    max-width: 430px;

    min-height: 100dvh;

    padding:
        max(16px, env(safe-area-inset-top))
        17px
        max(17px, env(safe-area-inset-bottom));

    display: flex;

    flex-direction: column;

    background: var(--surface);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    border-left:
        1px solid var(--border);

    border-right:
        1px solid var(--border);

    box-shadow: var(--shadow);
}


/* =========================
   HEADER
========================= */

.header {

    height: 64px;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.brand {

    display: flex;

    align-items: center;

    gap: 11px;
}


.brand-icon {

    width: 38px;
    height: 38px;

    display: grid;

    place-items: center;

    border-radius: 13px;

    background: var(--accent);

    color: var(--accent-text);

    font-size: 19px;

    font-weight: 800;
}


.brand-name {

    font-size: 18px;

    font-weight: 750;

    letter-spacing: -.4px;
}


/* =========================
   HISTORY BUTTON
========================= */

.history-btn {

    width: auto;
    height: auto;

    aspect-ratio: auto;

    padding: 9px 13px;

    border:
        1px solid var(--border);

    border-radius: 13px;

    background: transparent;

    color: var(--text);

    font-size: 13px;

    cursor: pointer;
}


/* =========================
   DISPLAY
========================= */

.display {

    flex: 1;

    min-height: 250px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: flex-end;

    padding:
        25px 4px 24px;

    overflow: hidden;
}


.expression {

    width: 100%;

    min-height: 28px;

    text-align: right;

    color: var(--muted);

    font-size: 17px;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;
}


.expression::-webkit-scrollbar {
    display: none;
}


.result {

    width: 100%;

    text-align: right;

    color: var(--text);

    font-size:
        clamp(48px, 15vw, 76px);

    font-weight: 300;

    letter-spacing: -3px;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;
}


.result::-webkit-scrollbar {
    display: none;
}


/* =========================
   BUTTON GRID
========================= */

.keys {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 11px;

    padding-top: 10px;
}


/* =========================
   BUTTON
========================= */

button {

    width: 100%;

    aspect-ratio: 1;

    border: 0;

    outline: 0;

    border-radius: 22px;

    background: var(--key);

    color: var(--key-text);

    font-size: 24px;

    font-weight: 520;

    cursor: pointer;

    user-select: none;

    transition:
        transform .08s ease,
        filter .1s ease;
}


button:active {

    transform: scale(.91);

    filter: brightness(.85);
}


/* =========================
   FUNCTIONS
========================= */

.function {

    background: var(--function);

    font-size: 19px;
}


/* =========================
   OPERATORS
========================= */

.operator {

    background: var(--accent);

    color: var(--accent-text);

    font-size: 27px;
}


.operator.active {

    transform: scale(.95);

    box-shadow:
        0 0 0 3px var(--border);
}


/* =========================
   EQUALS
========================= */

.equals {

    background: var(--accent);

    color: var(--accent-text);

    font-size: 27px;
}


/* =========================
   ZERO
========================= */

.zero {

    grid-column: span 2;

    aspect-ratio: auto;

    min-height: 82px;

    border-radius: 22px;

    text-align: left;

    padding-left: 29px;
}


/* =========================
   HISTORY OVERLAY
========================= */

.overlay {

    position: fixed;

    inset: 0;

    display: none;

    align-items: flex-end;

    background:
        rgba(0,0,0,.45);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    z-index: 20;
}


.overlay.show {

    display: flex;
}


/* =========================
   HISTORY PANEL
========================= */

.history-panel {

    width: 100%;

    max-width: 430px;

    max-height: 78dvh;

    margin: auto;

    padding: 22px;

    border:
        1px solid var(--border);

    border-radius:
        28px 28px 0 0;

    background: var(--surface);

    overflow-y: auto;
}


.history-top {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}


.history-title {

    margin: 0;

    font-size: 21px;
}


.close {

    width: 38px;
    height: 38px;

    aspect-ratio: auto;

    border-radius: 12px;

    background: var(--function);

    font-size: 18px;
}


/* =========================
   CLEAR HISTORY
========================= */

.history-actions {

    display: flex;

    gap: 9px;

    margin-bottom: 15px;
}


.clear-history {

    width: auto;
    height: auto;

    aspect-ratio: auto;

    padding: 10px 14px;

    border-radius: 12px;

    background: var(--function);

    color: var(--text);

    font-size: 13px;
}


/* =========================
   EMPTY HISTORY
========================= */

.empty {

    padding: 35px 10px;

    text-align: center;

    color: var(--muted);

    font-size: 14px;
}


/* =========================
   HISTORY ITEM
========================= */

.history-item {

    padding: 15px 0;

    border-bottom:
        1px solid var(--border);

    text-align: right;
}


.history-expression {

    color: var(--muted);

    font-size: 14px;
}


.history-result {

    margin-top: 5px;

    font-size: 23px;

    font-weight: 600;
}


/* =========================
   SMALL PHONES
========================= */

@media (max-height: 680px) {

    .header {
        height: 52px;
    }

    .display {

        min-height: 150px;

        padding-top: 8px;
    }

    .keys {
        gap: 8px;
    }

    button {
        font-size: 21px;
    }

    .zero {
        min-height: 64px;
    }
}

</style>
</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                ÷
            </div>

            <div class="brand-name">
                Calculator
            </div>

        </div>


        <button
            class="history-btn"
            onclick="openHistory()">

            History

        </button>

    </header>


    <!-- DISPLAY -->

    <main class="display">

        <div
            class="expression"
            id="expression">
        </div>


        <div
            class="result"
            id="result">

            0

        </div>

    </main>


    <!-- KEYS -->

    <section class="keys">


        <button
            class="function"
            onclick="clearCalc()">

            AC

        </button>


        <button
            class="function"
            onclick="backspace()">

            ⌫

        </button>


        <button
            class="function"
            onclick="percent()">

            %

        </button>


        <button
            class="operator"
            data-op="÷"
            onclick="choose('÷')">

            ÷

        </button>


        <button onclick="addNumber('7')">
            7
        </button>

        <button onclick="addNumber('8')">
            8
        </button>

        <button onclick="addNumber('9')">
            9
        </button>


        <button
            class="operator"
            data-op="×"
            onclick="choose('×')">

            ×

        </button>


        <button onclick="addNumber('4')">
            4
        </button>

        <button onclick="addNumber('5')">
            5
        </button>

        <button onclick="addNumber('6')">
            6
        </button>


        <button
            class="operator"
            data-op="−"
            onclick="choose('−')">

            −

        </button>


        <button onclick="addNumber('1')">
            1
        </button>

        <button onclick="addNumber('2')">
            2
        </button>

        <button onclick="addNumber('3')">
            3
        </button>


        <button
            class="operator"
            data-op="+"
            onclick="choose('+')">

            +

        </button>


        <button
            class="zero"
            onclick="addNumber('0')">

            0

        </button>


        <button onclick="decimal()">

            .

        </button>


        <button
            class="equals"
            onclick="calculate()">

            =

        </button>


    </section>

</div>



<!-- =========================
     HISTORY
========================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeOutside(event)">


    <div class="history-panel">


        <div class="history-top">

            <h2 class="history-title">
                History
            </h2>


            <button
                class="close"
                onclick="closeHistory()">

                ×

            </button>

        </div>


        <div class="history-actions">

            <button
                class="clear-history"
                onclick="clearHistory()">

                🗑 Clear History

            </button>

        </div>


        <div id="historyList"></div>


    </div>

</div>



<script>

/* =========================
   VARIABLES
========================= */

let current = "0";

let previous = null;

let operator = null;

let waiting = false;

let history = [];


/* =========================
   DISPLAY
========================= */

function update() {

    document
        .getElementById("result")
        .textContent = current;


    let expression = "";


    if (
        previous !== null &&
        operator !== null
    ) {

        expression =
            previous + " " + operator;

    }


    document
        .getElementById("expression")
        .textContent =
            expression;
}


/* =========================
   NUMBER
========================= */

function addNumber(number) {

    if (current === "Error") {

        clearCalc();

    }


    if (waiting) {

        current = number;

        waiting = false;

    }

    else if (current === "0") {

        current = number;

    }

    else {

        current += number;

    }


    update();
}


/* =========================
   DECIMAL
========================= */

function decimal() {

    if (waiting) {

        current = "0.";

        waiting = false;

    }

    else if (!current.includes(".")) {

        current += ".";

    }


    update();
}


/* =========================
   OPERATOR
========================= */

function choose(op) {

    if (current === "Error") {
        return;
    }


    if (
        operator !== null &&
        !waiting
    ) {

        calculate();

    }


    previous = current;

    operator = op;

    waiting = true;


    document
        .querySelectorAll(".operator")
        .forEach(button => {

            button.classList.remove("active");

        });


    const active =
        document.querySelector(
            `.operator[data-op="${op}"]`
        );


    if (active) {

        active.classList.add("active");

    }


    update();
}


/* =========================
   CALCULATE
========================= */

function calculate() {

    if (
        operator === null ||
        previous === null ||
        waiting
    ) {

        return;

    }


    const a =
        parseFloat(previous);

    const b =
        parseFloat(current);


    let result;


    if (operator === "+") {

        result = a + b;

    }

    else if (operator === "−") {

        result = a - b;

    }

    else if (operator === "×") {

        result = a * b;

    }

    else if (operator === "÷") {

        if (b === 0) {

            current = "Error";

            previous = null;

            operator = null;

            update();

            return;

        }


        result = a / b;

    }


    result =
        Number(result.toPrecision(12));


    const expression =
        previous +
        " " +
        operator +
        " " +
        current;


    current =
        String(result);


    history.unshift({

        expression:
            expression,

        result:
            current

    });


    if (history.length > 50) {

        history.pop();

    }


    saveHistory();


    previous = null;

    operator = null;

    waiting = true;


    document
        .querySelectorAll(".operator")
        .forEach(button => {

            button.classList.remove("active");

        });


    update();
}


/* =========================
   CLEAR
========================= */

function clearCalc() {

    current = "0";

    previous = null;

    operator = null;

    waiting = false;


    document
        .querySelectorAll(".operator")
        .forEach(button => {

            button.classList.remove("active");

        });


    update();
}


/* =========================
   BACKSPACE
========================= */

function backspace() {

    if (
        waiting ||
        current === "Error"
    ) {

        return;

    }


    if (current.length <= 1) {

        current = "0";

    }

    else {

        current =
            current.slice(0, -1);

    }


    update();
}


/* =========================
   PERCENT
========================= */

function percent() {

    if (current === "Error") {
        return;
    }


    current =
        String(
            parseFloat(current) / 100
        );


    update();
}


/* =========================
   HISTORY SAVE
========================= */

function saveHistory() {

    try {

        localStorage.setItem(
            "calculator_history",
            JSON.stringify(history)
        );

    }

    catch (error) {}

}


/* =========================
   HISTORY LOAD
========================= */

function loadHistory() {

    try {

        const saved =
            localStorage.getItem(
                "calculator_history"
            );


        if (saved) {

            history =
                JSON.parse(saved);

        }

    }

    catch (error) {

        history = [];

    }

}


/* =========================
   OPEN HISTORY
========================= */

function openHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    if (history.length === 0) {

        list.innerHTML = `

            <div class="empty">

                No calculations yet

            </div>

        `;

    }

    else {

        list.innerHTML =

            history.map(item => `

                <div class="history-item">

                    <div
                        class="history-expression">

                        ${safe(
                            item.expression
                        )}

                    </div>


                    <div
                        class="history-result">

                        = ${safe(
                            item.result
                        )}

                    </div>

                </div>

            `).join("");

    }


    document
        .getElementById("overlay")
        .classList.add("show");
}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory() {

    if (history.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            "Clear all calculation history?"
        );


    if (!confirmed) {
        return;
    }


    history = [];


    try {

        localStorage.removeItem(
            "calculator_history"
        );

    }

    catch (error) {}


    openHistory();
}


/* =========================
   CLOSE HISTORY
========================= */

function closeHistory() {

    document
        .getElementById("overlay")
        .classList.remove("show");
}


function closeOutside(event) {

    if (
        event.target.id ===
        "overlay"
    ) {

        closeHistory();

    }

}


/* =========================
   SAFE HTML
========================= */

function safe(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key >= "0" &&
            event.key <= "9"
        ) {

            addNumber(event.key);

        }


        else if (
            event.key === "."
        ) {

            decimal();

        }


        else if (
            event.key === "+"
        ) {

            choose("+");

        }


        else if (
            event.key === "-"
        ) {

            choose("−");

        }


        else if (
            event.key === "*"
        ) {

            choose("×");

        }


        else if (
            event.key === "/"
        ) {

            event.preventDefault();

            choose("÷");

        }


        else if (
            event.key === "%"
        ) {

            percent();

        }


        else if (
            event.key === "Enter" ||
            event.key === "="
        ) {

            calculate();

        }


        else if (
            event.key === "Backspace"
        ) {

            backspace();

        }


        else if (
            event.key === "Escape"
        ) {

            clearCalc();

        }

    }
);


/* =========================
   START
========================= */

loadHistory();

update();

</script>

</body>
</html>
